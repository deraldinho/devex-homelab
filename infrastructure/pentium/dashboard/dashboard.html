<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas Observability</title>
<style>
:root{color-scheme:dark;--bg:#0b0f14;--panel:#121923;--line:#263244;--text:#e8eef7;--muted:#8ea0b6;--good:#43d17d;--warn:#f5c451;--bad:#ff6b6b;--pause:#8ba7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,sans-serif}
main{max-width:1500px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:20px}
h1{margin:0;font-size:28px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-height:120px}.wide{grid-column:span 12}.half{grid-column:span 6}.third{grid-column:span 4}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.value{font-size:24px;font-weight:700;margin:5px 0}
.status{display:inline-flex;align-items:center;gap:7px;font-weight:700}.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.good .dot{background:var(--good)}.warn .dot{background:var(--warn)}.bad .dot{background:var(--bad)}.paused .dot{background:var(--pause)}
.pipeline{display:flex;gap:8px;align-items:center;overflow:auto;padding:12px 0}.stage{min-width:100px;padding:12px;border:1px solid var(--line);border-radius:10px;text-align:center}.arrow{color:var(--muted)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:7px 12px}.events{max-height:300px;overflow:auto}.event{padding:8px 0;border-bottom:1px solid var(--line)}
@media(max-width:850px){.half,.third{grid-column:span 12}.top{align-items:start;flex-direction:column}.kv{grid-template-columns:110px 1fr}}
</style>
</head><body>
<main>
  <div class="top">
    <div><div class="label">DevEx HomeLab</div><h1>Atlas Observability Dashboard</h1><div class="muted">Pentium via LAN · read-only</div></div>
    <div id="lastUpdate" class="muted">aguardando dados…</div>
  </div>
  <div class="grid">
    <section class="card third"><div class="label">Atlas</div><div id="atlasHealth" class="value">UNKNOWN</div><div id="atlasSha" class="muted">SHA —</div></section>
    <section class="card third"><div class="label">Voice</div><div id="voiceState" class="value">UNKNOWN</div><div id="voiceDetail" class="muted">—</div></section>
    <section class="card third"><div class="label">ANC</div><div id="ancState" class="value">UNKNOWN</div><div id="ancDetail" class="muted">—</div></section>
    <section class="card wide">
      <div class="label">Pipeline de interação</div>
      <div class="pipeline">
        <div class="stage">MIC</div><div class="arrow">→</div><div class="stage">ANC</div><div class="arrow">→</div><div class="stage">VAD</div><div class="arrow">→</div><div class="stage">Whisper</div><div class="arrow">→</div><div class="stage">Wake</div><div class="arrow">→</div><div class="stage">Qwen</div><div class="arrow">→</div><div class="stage">TTS</div>
      </div>
    </section>
    <section class="card half"><div class="label">Serviços</div><div id="services" class="kv"></div></section>
    <section class="card half"><div class="label">Áudio / microfones</div><div id="audio" class="kv"></div></section>
    <section class="card half"><div class="label">Sistema</div><div id="system" class="kv"></div></section>
    <section class="card half"><div class="label">Rede</div><div id="network" class="kv"></div></section>
    <section class="card wide"><div class="label">Timeline técnica</div><div id="events" class="events"></div></section>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = value => String(value ?? 'unknown').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function kv(target,obj){target.innerHTML=Object.entries(obj||{}).map(([k,v])=>`<div class="muted">${esc(k)}</div><div>${esc(typeof v==='object'?JSON.stringify(v):v)}</div>`).join('')||'<div class="muted">sem dados</div>';}
async function refreshAll(){
  try{
    const [statusRes,eventRes]=await Promise.all([fetch('/api/status',{cache:'no-store'}),fetch('/api/events',{cache:'no-store'})]);
    const status=await statusRes.json(); const events=await eventRes.json();
    $('atlasHealth').textContent=(status.atlas?.health||'unknown').toUpperCase();
    $('atlasSha').textContent=`SHA ${status.atlas?.sha||'unknown'}`;
    $('voiceState').textContent=(status.voice?.state||'unknown').toUpperCase();
    $('voiceDetail').textContent=`serviço ${status.services?.voice?.active||'unknown'} · ${status.services?.voice?.enabled||'unknown'}`;
    $('ancState').textContent=(status.anc?.state||'unknown').toUpperCase();
    $('ancDetail').textContent=status.anc?.reason||'sem diagnóstico adicional';
    kv($('services'),status.services); kv($('audio'),status.audio); kv($('system'),status.system); kv($('network'),status.network);
    $('events').innerHTML=(events||[]).slice().reverse().map(e=>`<div class="event"><b>${esc(e.severity)}</b> · ${esc(e.source)} · ${esc(e.message)}</div>`).join('')||'<div class="muted">sem eventos técnicos recentes</div>';
    $('lastUpdate').textContent=`atualizado ${new Date().toLocaleTimeString()}`;
  }catch(error){$('lastUpdate').textContent=`dashboard degradado · ${error.name}`;}
}
refreshAll();
setInterval(refreshAll, 2000);
</script>
</body>
</html>
