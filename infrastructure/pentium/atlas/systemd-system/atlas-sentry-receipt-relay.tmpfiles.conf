# CP-SENTRY-P4: prepared by authorized administrator before starting relay.
# Executor must be in atlas-sentry-relay group; only socket/group traversal is shared.
# No group write on the directory or receipt journal.
d /run/atlas-sentry-relay 0750 atlas-sentry-health atlas-sentry-relay - -
d /var/lib/atlas-sentry-health 0700 atlas-sentry-health atlas-sentry-health - -
