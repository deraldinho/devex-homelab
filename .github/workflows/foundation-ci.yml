name: Foundation CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-foundation:
    name: Validate Foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do HEAD exato
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Validar SHA e diff
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          if [[ -n "$BASE_REF" ]]; then
            git diff --check "origin/${BASE_REF}...HEAD"
          else
            git diff --check HEAD^ HEAD || git diff --check
          fi

      - name: Validar scripts e conteúdo sensível
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            bash -n "$script"
          done < <(git ls-files '*.sh')
          workflow='.github/workflows/foundation-ci.yml'
          if git grep -n -E 'github_pat_|ghp_|tskey-|BEGIN (OPENSSH )?PRIVATE KEY' -- . ":(exclude)$workflow"; then
            echo 'Padrão de secret encontrado em arquivo versionado.' >&2
            exit 1
          fi
          if git grep -n -E 'TODO|TBD' -- . ":(exclude)$workflow"; then
            echo 'Placeholder TODO/TBD encontrado.' >&2
            exit 1
          fi

      - name: Validar contrato da rede de gerenciamento
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f infrastructure/network/tests/test_health.py ]]; then
            python3 -m py_compile infrastructure/network/health.py
            python3 -m unittest discover \
              -s infrastructure/network/tests \
              -p 'test_*.py' \
              -v
            echo 'DEVEX_HOMELAB_NETWORK_CONTRACT_PASS'
          else
            echo 'NETWORK_CONTRACT_NOT_PRESENT_ON_THIS_STACK_LAYER'
          fi

      - name: Validar heartbeat do Pentium quando disponível
        shell: bash
        run: |
          set -euo pipefail
          heartbeat='infrastructure/pentium/heartbeat'
          if [[ -d "$heartbeat/tests" ]]; then
            python3 -m py_compile "$heartbeat/heartbeat.py"
            python3 -m json.tool "$heartbeat/config.json" >/dev/null
            python3 -m unittest discover \
              -s "$heartbeat/tests" \
              -p 'test_*.py' \
              -v
            if command -v systemd-analyze >/dev/null 2>&1; then
              systemd-analyze verify \
                "$heartbeat/systemd/pentium-heartbeat.service" \
                "$heartbeat/systemd/pentium-heartbeat.timer"
            fi
            echo 'DEVEX_HOMELAB_PENTIUM_HEARTBEAT_PASS'
          else
            echo 'PENTIUM_HEARTBEAT_NOT_PRESENT_ON_THIS_STACK_LAYER'
          fi

      - name: Validar Pentium Agent quando disponível
        shell: bash
        run: |
          set -euo pipefail
          agent='infrastructure/pentium/agent'
          if [[ -d "$agent/tests" ]]; then
            python3 -m py_compile \
              "$agent/agent.py" \
              "$agent/cli.py" \
              "$agent/ssh_transport.py" \
              "$agent/actions/x99_status.py"
            python3 -m json.tool "$agent/config.json" >/dev/null
            python3 -m unittest discover \
              -s "$agent/tests" \
              -p 'test_*.py' \
              -v
            echo 'DEVEX_HOMELAB_PENTIUM_AGENT_PASS'
          else
            echo 'PENTIUM_AGENT_NOT_PRESENT_ON_THIS_STACK_LAYER'
          fi

      - name: Validar simulação quando disponível
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f dev/simulation/compose.yaml ]]; then
            docker compose -f dev/simulation/compose.yaml config >/dev/null
            bash dev/simulation/verify.sh
          else
            echo 'SIMULATION_NOT_PRESENT_ON_THIS_STACK_LAYER'
          fi

      - name: Registrar evidência
        shell: bash
        run: |
          set -euo pipefail
          echo 'DEVEX_HOMELAB_FOUNDATION_CI_PASS'
          echo "head=$(git rev-parse HEAD)"
          echo "runner=${RUNNER_NAME}"
