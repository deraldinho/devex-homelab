name: Foundation CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-foundation:
    name: Validate Foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do HEAD exato
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Validar SHA e diff
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          if [[ -n "$BASE_REF" ]]; then
            git diff --check "origin/${BASE_REF}...HEAD"
          else
            git diff --check HEAD^ HEAD || git diff --check
          fi

      - name: Validar scripts e conteúdo sensível
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            bash -n "$script"
          done < <(git ls-files '*.sh')
          workflow='.github/workflows/foundation-ci.yml'
          if git grep -n -E 'github_pat_|ghp_|tskey-|BEGIN (OPENSSH )?PRIVATE KEY' -- . ":(exclude)$workflow"; then
            echo 'Padrão de secret encontrado em arquivo versionado.' >&2
            exit 1
          fi
          if git grep -n -E 'TODO|TBD' -- . ":(exclude)$workflow"; then
            echo 'Placeholder TODO/TBD encontrado.' >&2
            exit 1
          fi

      - name: Validar contrato da rede de gerenciamento
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f infrastructure/network/tests/test_health.py ]]; then
            python3 -m py_compile infrastructure/network/health.py
            python3 -m unittest discover \
              -s infrastructure/network/tests \
              -p 'test_*.py' \
              -v
            echo 'DEVEX_HOMELAB_NETWORK_CONTRACT_PASS'
          else
            echo 'NETWORK_CONTRACT_NOT_PRESENT_ON_THIS_STACK_LAYER'
          fi

      - name: Validar heartbeat do Pentium quando disponível
        shell: bash
        run: |
          set -euo pipefail
          heartbeat='infrastructure/pentium/heartbeat'
          if [[ -d "$heartbeat/tests" ]]; then
            python3 -m py_compile "$heartbeat/heartbeat.py"
            python3 -m json.tool "$heartbeat/config.json" >/dev/null
            python3 -m unittest discover \
              -s "$heartbeat/tests" \
              -p 'test_*.py' \
              -v
            if command -v systemd-analyze >/dev/null 2>&1; then
              systemd-analyze verify \
                "$heartbeat/systemd/pentium-heartbeat.service" \
                "$heartbeat/systemd/pentium-heartbeat.timer"
            fi
            echo 'DEVEX_HOMELAB_PENTIUM_HEARTBEAT_PASS'
          else
            echo 'PENTIUM_HEARTBEAT_NOT_PRESENT_ON_THIS_STACK_LAYER'
          fi

      - name: Validar Pentium Agent quando disponível
        shell: bash
        run: |
          set -euo pipefail
          agent='infrastructure/pentium/agent'
          if [[ -d "$agent/tests" ]]; then
            python3 -m py_compile \
              "$agent/agent.py" \
              "$agent/cli.py" \
              "$agent/ssh_transport.py" \
              "$agent/actions/x99_status.py"
            python3 -m json.tool "$agent/config.json" >/dev/null
            python3 -m unittest discover \
              -s "$agent/tests" \
              -p 'test_*.py' \
              -v
            echo 'DEVEX_HOMELAB_PENTIUM_AGENT_PASS'
          else
            echo 'PENTIUM_AGENT_NOT_PRESENT_ON_THIS_STACK_LAYER'
          fi

      - name: Validate Atlas State Reaction Foundation
        shell: bash
        run: |
          set -euo pipefail
          atlas='infrastructure/pentium/atlas'
          if [[ -d "$atlas/tests" ]]; then
            python3 -m py_compile \
              "$atlas/state_model.py" \
              "$atlas/health_engine.py" \
              "$atlas/reaction_engine.py" \
              "$atlas/journal.py" \
              "$atlas/stimulus_model.py" \
              "$atlas/stimulus_bus.py" \
              "$atlas/stimulus_journal.py" \
              "$atlas/network_discovery.py" \
              "$atlas/network_discovery_smoke.py" \
              "$atlas/presence_registry.py" \
              "$atlas/presence_persistence.py" \
              "$atlas/stimulus_sources.py" \
              "$atlas/observation_runtime.py" \
              "$atlas/modelo_afetivo.py" \
              "$atlas/configuracao_afetiva.py" \
              "$atlas/decaimento_afetivo.py" \
              "$atlas/motor_afetivo.py" \
              "$atlas/persistencia_afetiva.py" \
              "$atlas/modelo_contexto_afetivo.py" \
              "$atlas/contexto_afetivo.py" \
              "$atlas/persistencia_contexto_afetivo.py" \
              "$atlas/modelo_percepcao.py" \
              "$atlas/percepcao.py" \
              "$atlas/adaptador_stimulus_percepcao.py" \
              "$atlas/grafo_dependencias.py" \
              "$atlas/modelo_incidente.py" \
              "$atlas/correlacionador_incidentes.py" \
              "$atlas/pipeline_percepcao_correlacao.py" \
              "$atlas/persistencia_percepcao_correlacao.py" \
              "$atlas/modelo_foco.py" \
              "$atlas/motor_foco.py" \
              "$atlas/emocao_derivada.py" \
              "$atlas/contexto_foco_emocao.py" \
              "$atlas/persistencia_foco_emocao.py" \
              "$atlas/modelo_contexto_cognitivo.py" \
              "$atlas/configuracao_cognitiva.py" \
              "$atlas/contexto_cognitivo.py" \
              "$atlas/politica_ativacao_cognitiva.py" \
              "$atlas/modelo_llm_gateway.py" \
              "$atlas/configuracao_llm.py" \
              "$atlas/llm_gateway.py" \
              "$atlas/llama_cpp_backend.py" \
              "$atlas/reaction_loop_cognitivo.py" \
              "$atlas/capability_registry.py" \
              "$atlas/policy_capabilities.py" \
              "$atlas/saida_cognitiva.py" \
              "$atlas/certificacao_cognitiva.py" \
              "$atlas/sampler_linux_cognitivo.py" \
              "$atlas/cli.py"
            python3 -m json.tool "$atlas/config.json" >/dev/null
            python3 -m json.tool "$atlas/observation_config.json" >/dev/null
            python3 -m json.tool "$atlas/config_afetiva.json" >/dev/null
            python3 -m json.tool "$atlas/config_percepcao.json" >/dev/null
            python3 -m json.tool "$atlas/config_foco_emocao.json" >/dev/null
            python3 -m json.tool "$atlas/config_cognitiva.json" >/dev/null
            python3 -m json.tool "$atlas/config_llm.json" >/dev/null
            python3 -m unittest infrastructure.pentium.atlas.tests.test_network_discovery -v
            python3 -m unittest infrastructure.pentium.atlas.tests.test_presence_registry -v
            python3 -m unittest infrastructure.pentium.atlas.tests.test_presence_persistence -v
            python3 -m unittest infrastructure.pentium.atlas.tests.test_presence_source_d2 -v
            python3 -m unittest discover -s "$atlas/tests" -p 'test_*.py' -v
            python3 -m infrastructure.pentium.atlas.cli --input "$atlas/tests/fixtures/healthy.json" >/tmp/atlas-healthy.json
            python3 -m infrastructure.pentium.atlas.cli --input "$atlas/tests/fixtures/critical.json" >/tmp/atlas-critical.json
            python3 -c "import json,pathlib; h=json.loads(pathlib.Path('/tmp/atlas-healthy.json').read_text()); c=json.loads(pathlib.Path('/tmp/atlas-critical.json').read_text()); assert h['assessment']['state']=='healthy'; assert c['assessment']['state']=='critical'; assert c['reaction']['reaction_id']=='critical.canonical'"
            bash -n "$atlas/install-user.sh"
            echo 'DEVEX_HOMELAB_ATLAS_STATE_REACTION_PASS'
            echo 'DEVEX_HOMELAB_ATLAS_OBSERVATION_PASS'
            echo 'DEVEX_HOMELAB_ATLAS_D1_DISCOVERY_PASS'
            echo 'DEVEX_HOMELAB_ATLAS_D2_IDENTITY_PRESENCE_PASS'
            echo 'DEVEX_HOMELAB_ATLAS_AFETIVO_A1_PASS'
            echo 'DEVEX_HOMELAB_ATLAS_AFETIVO_A2_PASS'
            echo 'DEVEX_HOMELAB_ATLAS_AFETIVO_A3_PASS'
            echo 'DEVEX_HOMELAB_ATLAS_AFETIVO_A4_PASS'
            echo 'DEVEX_HOMELAB_ATLAS_COGNITIVO_C1_PASS'
            echo 'DEVEX_HOMELAB_ATLAS_COGNITIVO_C2_PASS'
            echo 'DEVEX_HOMELAB_ATLAS_COGNITIVO_C3_PASS'
            echo 'DEVEX_HOMELAB_ATLAS_COGNITIVO_C4_PASS'
            echo 'DEVEX_HOMELAB_ATLAS_COGNITIVO_C5_HARNESS_PASS'
          else
            echo 'ATLAS_STATE_REACTION_NOT_PRESENT_ON_THIS_STACK_LAYER'
          fi

      - name: Validar simulação quando disponível
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f dev/simulation/compose.yaml ]]; then
            docker compose -f dev/simulation/compose.yaml config >/dev/null
            bash dev/simulation/verify.sh
          else
            echo 'SIMULATION_NOT_PRESENT_ON_THIS_STACK_LAYER'
          fi

      - name: Registrar evidência
        shell: bash
        run: |
          set -euo pipefail
          echo 'DEVEX_HOMELAB_FOUNDATION_CI_PASS'
          echo "head=$(git rev-parse HEAD)"
          echo "runner=${RUNNER_NAME}"
